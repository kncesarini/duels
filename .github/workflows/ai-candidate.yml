name: ai-candidate

# Milestone M6b's PR-side half: when a pull request changes an agent, measure
# that agent against the designated champion and say plainly how far apart
# they are. Also measures against a non-learned-leaf third party (THIRD_PARTY
# below), so a learned-value change cannot be promoted purely on a
# champion-only margin the way `mcts-value` originally was — see that agent's
# crate docs and `duels_arena::leaderboard::CHAMPION`'s doc comment for why
# that distinction matters.
#
# **This check is informational and does not gate merge.** It lives in its own
# workflow file, so it is not - and structurally cannot become - part of
# `ci.yml`'s `gate` job, which is the only context the `main-protection`
# ruleset requires. A red `ai-candidate` is a prompt to read the numbers, not a
# blocked merge. Promoting it to blocking is a deliberate future change: add it
# to `gate`'s `needs:` in `ci.yml` *and* to the ruleset's required checks.
#
# The game count here is calibrated for a few minutes of CI, not for the
# ~3,000-game rigor this project applies to a real accept/reject decision. It
# is a smoke signal - "did this change move strength by a lot, in which
# direction" - and the report says so. A genuine promotion decision runs the
# nightly round robin (`nightly-arena.yml`) or a hand-run paired match on a
# quiet machine.

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/agents/**'
      - 'crates/duels-agents-api/**'
      # `duels-eval` and `duels-value` are not agents, but every agent built on
      # one moves when it does - which is exactly the kind of change this
      # check exists to notice. `duels-value` backs the champion (`mcts-value`)
      # the same way `duels-eval` backs the rest of the ladder.
      - 'crates/duels-eval/**'
      - 'crates/duels-value/**'
      - '.github/workflows/ai-candidate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Games per candidate-vs-champion match. The sample size is chosen for the
  # Elo interval it buys, not for the wall clock: at 400 games the interval is
  # roughly +/-100 points wide, which resolves "this agent is much
  # weaker/stronger" and nothing finer. See this workflow's header on why it is
  # not 3,000.
  #
  # The original cost calibration was a measured `greedy` vs `mcts-uct` run at
  # 1,493 ms of single-threaded work per game on a GitHub-hosted 4-vCPU runner,
  # so 400 games was about 2.5 minutes of match on top of a ~30 s cached build.
  # `greedy` was retired in #60 and the cheapest pairing now involves `phased`
  # plus a search, so treat that per-game figure as a floor rather than as the
  # current cost. `timeout-minutes` below is the actual guard.
  GAMES: '400'
  BUDGET: 'nodes:2000'
  # A second, cheaper opponent that is never a learned-leaf agent. The
  # champion-only check above is exactly how the ladder promoted `mcts-value`
  # on a margin that was mostly route-substitution through `mcts-eval`'s own
  # science-value miscalibration (see `mcts-value`'s crate docs and
  # `duels_arena::leaderboard::CHAMPION`'s doc comment) — measured through a
  # non-learned third party, most of that margin was gone. This row exists so
  # a *future* learned-value change cannot repeat that mistake and sail
  # through this check on a champion-only exploit. Informational only, same
  # as everything else here; kept at a smaller game count purely to hold the
  # total workflow time down, not because the check matters less.
  THIRD_PARTY: 'mcts-uct'
  THIRD_PARTY_GAMES: '200'

jobs:
  ai-candidate:
    name: ai-candidate (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff the PR against its merge base.
          fetch-depth: 0

      - name: Work out which agents this PR touches
        id: changed
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'

          # One name per changed agent crate directory. These directory names
          # are the `agent_registry` names verbatim (checked by
          # `duels_arena::leaderboard::tests::every_ladder_agent_can_actually_be_constructed`).
          agents="$(git diff --name-only "$base" "$head" -- crates/agents/ \
            | awk -F/ 'NF >= 3 { print $3 }' | sort -u | tr '\n' ' ')"

          api_changed=false
          if ! git diff --quiet "$base" "$head" -- crates/duels-agents-api/; then
            api_changed=true
          fi

          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "api_changed=$api_changed" >> "$GITHUB_OUTPUT"
          echo "Changed agent crates: ${agents:-<none>} (agents-api changed: $api_changed)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build duels-arena (release)
        run: cargo build --release -p duels-arena

      - name: Measure each changed agent against the champion
        id: measure
        run: |
          set -euo pipefail
          arena=./target/release/duels-arena
          champion="$("$arena" champion --field agent)"
          agents='${{ steps.changed.outputs.agents }}'

          # A change to the Agent contract with no agent crate touched: read
          # the champion itself, so the branch below pits it against the
          # runner-up.
          if [ -z "${agents// /}" ] && [ '${{ steps.changed.outputs.api_changed }}' = 'true' ]; then
            agents="$champion"
          fi

          if [ -z "${agents// /}" ]; then
            echo 'No agent crate changed in this PR, so there is nothing to measure.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'report=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The strongest agent on the committed leaderboard that is *not* the
          # champion. Used when the champion itself is what changed, since
          # measuring it against a binary built from the same PR would be
          # self-play and tell nobody anything.
          #
          # The fallback below only applies when `arena/leaderboard.json` is
          # missing or unreadable; it is `mcts-eval` because that is the
          # runner-up on the ladder as `duels_arena::leaderboard::LADDER`
          # orders it. Note that the committed leaderboard the `jq` below
          # prefers is a *generated* artifact and can lag the ladder — it does
          # today, still listing the agents retired in #60 — so this fallback
          # is the more accurate of the two until a nightly run lands.
          runner_up='mcts-eval'
          if [ -f arena/leaderboard.json ]; then
            found="$(jq -r --arg c "$champion" \
              'first(.rows[] | select(.agent != $c) | .agent) // empty' \
              arena/leaderboard.json || true)"
            # An `x && y` one-liner would abort the whole step under `set -e`
            # whenever `x` is false, which here is the ordinary case.
            if [ -n "$found" ]; then
              runner_up="$found"
            fi
          fi

          : > report.md
          {
            echo '## ai-candidate (informational - does not gate merge)'
            echo ''
            echo "Champion: \`$("$arena" champion --field spec)\`."
            echo "Each match below is ${GAMES} games, paired seeds, seat-swapped, at \`${BUDGET}\`."
            echo "That is a smoke signal, not the ~3,000-game evidence this project requires"
            echo 'for a real accept/reject; see `.github/workflows/ai-candidate.yml`.'
            echo ''
          } >> report.md

          # Every agent the arena knows how to build, one per line - so a PR
          # that adds a crate directory without registering it is reported
          # rather than failing the run with an opaque "unknown agent".
          "$arena" pairings --format lines | tr ' ' '\n' | sort -u > known-agents.txt

          for agent in $agents; do
            if ! grep -qx "$agent" known-agents.txt; then
              {
                echo "### \`$agent\`"
                echo ''
                echo "Not registered in \`duels_arena::agent_registry\`, so the arena cannot build it - skipped. Add a \`make_agent\` arm and a \`LADDER\` entry to get it measured."
                echo ''
              } >> report.md
              continue
            fi

            opponent="$champion"
            note=''
            if [ "$agent" = "$champion" ]; then
              opponent="$runner_up"
              note="\`$agent\` **is** the champion, so it is measured against \`$opponent\`, the next agent on the committed leaderboard - comparing it against itself would be self-play."
            fi

            echo "Running $agent vs $opponent..."
            "$arena" match \
              --agent-a "$agent" \
              --agent-b "$opponent" \
              --games "$GAMES" \
              --budget "$BUDGET" \
              --seed 1 \
              --out "arena/results/ai-candidate-$agent.json" \
              | tee "match-$agent.log"

            elo_line="$(grep '^elo:' "match-$agent.log" || echo 'elo: (not reported)')"
            result_line="$(grep '^results:' "match-$agent.log" || echo '')"

            {
              echo "### \`$agent\` vs \`$opponent\`"
              echo ''
              if [ -n "$note" ]; then
                echo "$note"
                echo ''
              fi
              echo '```'
              echo "$result_line"
              echo "$elo_line"
              echo '```'
              echo ''
              echo '<details><summary>Full match output</summary>'
              echo ''
              echo '```'
              cat "match-$agent.log"
              echo '```'
              echo ''
              echo '</details>'
              echo ''
            } >> report.md

            # The third-party check (see THIRD_PARTY's comment above): a
            # non-learned-leaf opponent, so a candidate's margin against the
            # champion can be read next to its margin against something that
            # was never `mcts-eval`'s specific miscalibration. Skipped only
            # when the changed agent *is* the third party itself, which would
            # be self-play; there is no useful stand-in substitution here the
            # way `champion`/`runner_up` have one, since the whole point is
            # this specific opponent.
            if [ "$agent" = "$THIRD_PARTY" ]; then
              {
                echo "### \`$agent\` vs third party"
                echo ''
                echo "\`$agent\` **is** this workflow's third-party opponent (\`$THIRD_PARTY\`), so this check is skipped - comparing it against itself would be self-play."
                echo ''
              } >> report.md
              continue
            fi
            if ! grep -qx "$THIRD_PARTY" known-agents.txt; then
              continue
            fi

            echo "Running $agent vs $THIRD_PARTY (third-party check)..."
            "$arena" match \
              --agent-a "$agent" \
              --agent-b "$THIRD_PARTY" \
              --games "$THIRD_PARTY_GAMES" \
              --budget "$BUDGET" \
              --seed 1 \
              --out "arena/results/ai-candidate-$agent-vs-third-party.json" \
              | tee "match-$agent-vs-third-party.log"

            tp_elo_line="$(grep '^elo:' "match-$agent-vs-third-party.log" || echo 'elo: (not reported)')"
            tp_result_line="$(grep '^results:' "match-$agent-vs-third-party.log" || echo '')"

            {
              echo "### \`$agent\` vs \`$THIRD_PARTY\` (third-party check, ${THIRD_PARTY_GAMES} games)"
              echo ''
              echo "Never a learned-leaf agent, so this margin is not read through \`mcts-eval\`'s"
              echo "specific science-value miscalibration the way the champion match above can be."
              echo "Compare the two Elo figures for this agent: a genuine strength gain should show"
              echo "up here at a healthier fraction of the champion-match margin than this project"
              echo "has previously measured (as little as ~12-28%, see \`mcts-value\`'s crate docs)."
              echo ''
              echo '```'
              echo "$tp_result_line"
              echo "$tp_elo_line"
              echo '```'
              echo ''
              echo '<details><summary>Full match output</summary>'
              echo ''
              echo '```'
              cat "match-$agent-vs-third-party.log"
              echo '```'
              echo ''
              echo '</details>'
              echo ''
            } >> report.md
          done

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo 'report=report.md' >> "$GITHUB_OUTPUT"

      - name: Post the report as a PR comment
        if: steps.measure.outputs.report != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A marker so each run edits its own comment instead of adding a new
          # one on every push.
          marker='<!-- ai-candidate-report -->'
          printf '%s\n' "$marker" > comment.md
          cat report.md >> comment.md

          # `--jq` runs once per page under `--paginate`, so filter to ids and
          # take the last line rather than asking jq for `last`.
          existing="$(gh api --paginate \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)"

          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@comment.md > /dev/null
            echo "Updated the existing ai-candidate comment ($existing)."
          else
            gh pr comment '${{ github.event.pull_request.number }}' --body-file comment.md
          fi
