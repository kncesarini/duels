name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'crates/duels-core/**'
              - 'crates/duels-server/**'
              - 'crates/agents/random/**'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.web == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.web == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate TypeScript bindings and check for drift
        if: steps.filter.outputs.web == 'true'
        # `duels-server` always requests `duels-core`'s `ts` feature, so this
        # single test run regenerates every `#[ts(export)]` type from both
        # crates into web/src/generated/ (see .cargo/config.toml). If the
        # checked-in files disagree with what the Rust types actually produce,
        # the Rust and TS sides have silently diverged - fail the build.
        run: |
          cargo test -p duels-server
          git diff --exit-code -- web/src/generated || {
            echo "::error::web/src/generated is stale - run \`cargo test -p duels-server\` and commit the result.";
            exit 1;
          }
      - name: npm ci
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Typecheck
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run typecheck
      - name: Lint
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run lint
      - name: Unit tests
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm test
      - name: Build
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'crates/**'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.web == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.web == 'true'
      - name: Build duels-server (release)
        if: steps.filter.outputs.web == 'true'
        run: cargo build --release -p duels-server
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Build web client
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Play a full game end to end through the UI
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: steps.filter.outputs.web == 'true' && failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, web, e2e]
    steps:
      - name: All checks passed
        run: echo "All required checks passed"
