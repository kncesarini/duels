name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  train-value-grad:
    name: train-value-grad
    runs-on: ubuntu-latest
    # `tools/train_value.py` itself is a build-time tool CI never runs (see
    # its own module docs) -- but its `--value-target-lambda` blended-loss
    # gradient is exactly the kind of hand-derived math that can silently
    # regress (see docs/roadmap.md's Tier 1 arm C investigation, where a
    # wrong gradient there produced a real, non-obvious Elo loss). This job
    # is deliberately narrow: only the finite-difference gradient check,
    # never the training run itself.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: pip install numpy
        run: pip install numpy
      - name: Finite-difference check of the blended-loss gradient
        working-directory: tools
        run: python3 test_train_value_grad.py
      - name: Record-size regression check for merge_feature_matrices.py
        working-directory: tools
        run: python3 test_merge_feature_matrices.py

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'crates/duels-core/**'
              - 'crates/duels-server/**'
              # `duels-server` links every one of these directly (see its
              # `Cargo.toml`), so a compile error in any of them fails
              # `cargo test -p duels-server` below - which this job needs to
              # succeed regardless of whether it changes any TS-exported type.
              - 'crates/agents/random/**'
              - 'crates/agents/phased/**'
              - 'crates/agents/alphabeta/**'
              - 'crates/agents/mcts-uct/**'
              - 'crates/agents/mcts-eval/**'
              - 'crates/agents/mcts-value/**'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.web == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.web == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate TypeScript bindings and check for drift
        if: steps.filter.outputs.web == 'true'
        # `duels-server` always requests `duels-core`'s `ts` feature, so this
        # single test run regenerates every `#[ts(export)]` type from both
        # crates into web/src/generated/ (see .cargo/config.toml). If the
        # checked-in files disagree with what the Rust types actually produce,
        # the Rust and TS sides have silently diverged - fail the build.
        run: |
          cargo test -p duels-server
          git diff --exit-code -- web/src/generated || {
            echo "::error::web/src/generated is stale - run \`cargo test -p duels-server\` and commit the result.";
            exit 1;
          }
      - name: npm ci
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Typecheck
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run typecheck
      - name: Lint
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run lint
      - name: Unit tests
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm test
      - name: Build
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'crates/**'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.web == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.web == 'true'
      - name: Build duels-server (release)
        if: steps.filter.outputs.web == 'true'
        run: cargo build --release -p duels-server
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Build web client
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        # `ubuntu-latest` ships Google Chrome preinstalled, with its own apt
        # source (dl.google.com/linux/chrome-stable/deb) preconfigured. We
        # don't use system Chrome - `playwright install --with-deps` only
        # needs Ubuntu's own library packages to run its bundled Chromium -
        # but that command still `apt-get update`s every configured source,
        # including Google's, and that repo has been intermittently serving
        # an InRelease/Packages pair whose hashes don't match ("Hash Sum
        # mismatch"), which fails the whole apt-get update (and so the whole
        # install) even though nothing we do actually reads from it. Drop
        # the source before touching apt, and retry with backoff in case of
        # any other transient mirror hiccup (e.g. the Azure archive mirror).
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          for attempt in 1 2 3 4 5; do
            echo "Install attempt $attempt"
            if sudo apt-get update && npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed; clearing apt cache and backing off"
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done
          echo "::error::Failed to install Playwright browsers after 5 attempts"
          exit 1
      - name: Play a full game end to end through the UI
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: steps.filter.outputs.web == 'true' && failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, train-value-grad, web, e2e]
    steps:
      - name: All checks passed
        run: echo "All required checks passed"
