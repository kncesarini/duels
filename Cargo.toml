[workspace]
resolver = "2"
members = [
    "crates/duels-core",
    "crates/duels-agents-api",
    "crates/duels-arena",
    "crates/duels-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
