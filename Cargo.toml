[workspace]
resolver = "2"
members = [
    "crates/duels-core",
    "crates/duels-agents-api",
    "crates/duels-strategy",
    "crates/duels-eval",
    "crates/duels-arena",
    "crates/duels-server",
    # Retired from the agent roster, kept as a test-only fixture: the
    # uniform-random baseline every search agent's correctness floor is
    # measured against. Not registered in `duels-arena`'s `agent_registry` or
    # `duels-server`'s `room`, and a dev-dependency only. See its crate docs.
    "crates/agents/random",
    "crates/agents/phased",
    "crates/agents/mcts-uct",
    "crates/agents/mcts-eval",
    "crates/agents/alphabeta",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.bench]
debug = true
