[package]
name = "duels-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tournament runner: plays Agent implementations against each other, tracks Elo, and runs SPRT."

[dependencies]
duels-core = { path = "../duels-core" }
duels-agents-api = { path = "../duels-agents-api" }
duels-agent-phased = { path = "../agents/phased" }
duels-eval = { path = "../duels-eval" }
# Read by `examples/feature_dump.rs`, which turns a `value_corpus.rs` corpus
# into a `duels-value` training matrix. A normal dependency rather than a
# dev-dependency only because cargo examples are built from `[dependencies]`.
duels-value = { path = "../duels-value" }
duels-agent-alphabeta = { path = "../agents/alphabeta" }
duels-agent-mcts-uct = { path = "../agents/mcts-uct" }
duels-agent-mcts-eval = { path = "../agents/mcts-eval" }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rayon = "1"
duels-strategy = { path = "../duels-strategy" }

[dev-dependencies]
# Retired from the roster, kept as a test fixture: `age_start_policy`'s
# wrapper tests need a cheap *stateful, RNG-consuming* inner agent and scan
# up to 200 whole games for a seed with no age-boundary choice, and
# `examples/ensemble_lab.rs` prices a search against a random opponent. A
# dev-dependency, so the shipped binary does not link it and no spec string
# can name it. See `duels-agent-random`'s crate docs.
duels-agent-random = { path = "../agents/random" }
