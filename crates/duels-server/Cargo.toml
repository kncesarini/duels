[package]
name = "duels-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server-authoritative, room-based WebSocket/REST game server for 7 Wonders Duel."

[dependencies]
duels-core = { path = "../duels-core", features = ["ts"] }
duels-agents-api = { path = "../duels-agents-api" }
duels-agent-random = { path = "../agents/random" }
duels-agent-greedy = { path = "../agents/greedy" }
duels-agent-greedy-ev = { path = "../agents/greedy-ev" }
duels-agent-strategist = { path = "../agents/strategist" }
duels-agent-alphabeta = { path = "../agents/alphabeta" }
duels-agent-mcts-uct = { path = "../agents/mcts-uct" }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
ts-rs = "12"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
