[package]
name = "duels-agent-strategist"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A 1-ply heuristic Agent: duels-agent-greedy-ev's exact chance-expectation evaluation plus a move-level prior from duels-strategy's win-condition reads, so a race the evaluation alone cannot see still gets picked up."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
duels-strategy = { path = "../../duels-strategy" }
rand = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
duels-agent-greedy = { path = "../greedy" }
duels-agent-greedy-ev = { path = "../greedy-ev" }
