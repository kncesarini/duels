[package]
name = "duels-agent-phased"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A 1-ply heuristic Agent over duels-eval: sample a state, build one Root, score every legal action, play the best. The evaluation itself lives in duels-eval."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
duels-eval = { path = "../../duels-eval" }
rand = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
duels-agent-mcts-uct = { path = "../mcts-uct" }
