[package]
name = "duels-agent-mcts-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Monte Carlo Tree Search with explicit chance nodes whose leaf value is half playout, half duels-eval evaluation. The measured strongest configuration this project has found, as its own permanent agent."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
duels-strategy = { path = "../../duels-strategy" }
# The shared hand-crafted evaluation: this agent's whole identity. Tracked at
# `duels_eval::Config::default()` and deliberately *not* pinned to a frozen
# generation — see the crate docs' "Tracking duels-eval live" section. A
# library below the agents, not another agent crate (see "the layering" in
# CLAUDE.md); the search machinery below is a deliberate copy of `mcts-uct`'s
# rather than a dependency on it, per the "agent crates are self-contained"
# invariant.
duels-eval = { path = "../../duels-eval" }
# The *learned* position value, read only by the opt-in
# `LeafValue::Learned` / `LeafValue::LearnedBlend` variants. Nothing on this
# crate's default path touches it, and it is a library below the agents for the
# same reason `duels-eval` is. See `duels-value`'s crate docs for what it
# measures inside this search.
duels-value = { path = "../../duels-value" }
rand = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
