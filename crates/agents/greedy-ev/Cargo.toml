[package]
name = "duels-agent-greedy-ev"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A 1-ply heuristic Agent: like duels-agent-greedy, but resolves each candidate action's chance outcomes by exact probability-weighted expectation instead of committing to one sampled guess."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
rand = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
duels-agent-greedy = { path = "../greedy" }
