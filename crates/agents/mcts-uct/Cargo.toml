[package]
name = "duels-agent-mcts-uct"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Monte Carlo Tree Search (UCT) with explicit chance nodes over the engine's chance API."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
duels-strategy = { path = "../../duels-strategy" }
# The shared hand-crafted evaluation, used as an optional leaf value (see
# `Config::leaf`). A library below the agents, not another agent crate — see
# "the layering" in CLAUDE.md.
duels-eval = { path = "../../duels-eval" }
rand = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
