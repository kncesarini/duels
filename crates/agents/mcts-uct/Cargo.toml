[package]
name = "duels-agent-mcts-uct"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Monte Carlo Tree Search (UCT) with explicit chance nodes over the engine's chance API."

[dependencies]
duels-core = { path = "../../duels-core" }
duels-agents-api = { path = "../../duels-agents-api" }
duels-strategy = { path = "../../duels-strategy" }
rand = { workspace = true }
# Portable `ln`/`pow` for UCB1 and progressive widening, so a seed produces
# the same search on every architecture; see the root `Cargo.toml`'s comment
# on this dependency.
libm = { workspace = true }

[dev-dependencies]
duels-agent-random = { path = "../random" }
