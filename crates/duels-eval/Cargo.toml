[package]
name = "duels-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The hand-crafted 7 Wonders Duel position evaluation: every weight a continuous function of how committed each player is to a win condition, computed once per decision from duels-strategy's calibrated public reads. A library below the agents, not an agent."

# Deliberately `duels-core` and `duels-strategy` and nothing else. `Root::new`,
# `evaluate` and `expected_value` are pure functions of the state they are
# handed, so this crate needs neither `rand` nor `duels-agents-api` — which is
# what lets any agent depend on it without depending on another agent.
[dependencies]
duels-core = { path = "../duels-core" }
duels-strategy = { path = "../duels-strategy" }

# `rand` is a *dev*-dependency only: the tests and diagnostics drive real games,
# and `engine::apply` / `Observation::sample_state` take an explicitly seeded
# `StdRng`. `duels-strategy` does the same for the same reason.
[dev-dependencies]
rand = { workspace = true }
